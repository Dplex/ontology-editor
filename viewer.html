<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내보낸 파일 보기 — ontology-editor</title>
    <!-- 에디터(index.html)와 같은 테마를 그리기 전에 정한다. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('oe-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
        } catch (e) {
          // 저장소를 못 읽으면 라이트로 둔다.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
