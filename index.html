<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ontology-editor</title>

    <!-- 테마 결정은 스타일시트가 그려지기 전에 끝나야 한다. 나중에 하면 라이트로 한 프레임
         그렸다가 다크로 튀는 깜빡임이 생긴다.

         **기본은 라이트다.** 시스템이 다크라도 따라가지 않는다. 온종일 값을 고쳐 넣는
         도구라서 밝은 쪽을 기본으로 두고, 원하는 사람만 토글로 바꾼다. -->
    <script>
      (function () {
        try {
          // 편집 화면 비교판(design-system.md): 에디터는 다크가 기본이다. 라이트를 고른 사람만 라이트.
          if (localStorage.getItem('oe-theme') !== 'light') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {
          // 사생활 보호 모드에서는 저장소를 못 읽는다. 그때도 기본값인 다크로 둔다.
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
