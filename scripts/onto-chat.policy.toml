# 온톨로지 질의 챗봇(/__ask, scripts/docs-chat.mjs 의 name 'onto')이 gemini 에 --admin-policy 로 넘기는 정책. ADR-0050.
# 문서 챗봇 정책(docs-chat.policy.toml)과 같은 모양이다. 반영한 온톨로지를 읽기만 하는 MCP 서버(onto) 말고는 아무 도구도 못 쓴다.

[[rule]]
toolName = "*"
decision = "deny"
priority = 100

# toolName 을 같이 적지 않는다 — gemini --acp 에서 MCP 도구까지 막혔다(docs-chat.policy.toml 의 주석).
[[rule]]
mcpName = "onto"
decision = "allow"
priority = 900
