# 문서 챗봇(scripts/docs-chat.mjs)이 gemini 에 --admin-policy 로 넘기는 정책. ADR-0001.
# 8084 는 사내망 누구나 열기 때문에, 문서 읽는 MCP 서버(docs) 말고는 아무 도구도 못 쓰게 한다.
# admin 등급이라 55 계정의 ~/.gemini/policies(user 등급)가 무엇을 허용해도 이게 이긴다.
# 전역 deny 는 도구를 모델에게 아예 보이지 않게 한다(gemini policy-engine 문서).

[[rule]]
toolName = "*"
decision = "deny"
priority = 100

# toolName 을 같이 적지 않는다. `toolName = "*"` 를 붙이면 gemini --acp 에서는 docs 도구까지 "denied by policy" 로
# 막혔다(gemini 0.62, 55 실측 2026-10-06). mcpName 만 두면 그 서버의 도구 전부에 걸린다(policy-engine 문서).
[[rule]]
mcpName = "docs"
decision = "allow"
priority = 900
