<!--

  브라우저로 파일을 그냥 열면 된다(three.js 를 CDN 에서 받으므로 인터넷이 필요하다).
  숫자(각도 스냅 ±3°, 이어진 구간 ±8°, 고정 화면 거리 28px, 기본 기울기·폭)는 시험용 값이다.
-->

<h1>수직 관통 오브젝트 배치 프로토타입</h1>
<p class="sub">엘리베이터: 시작/끝 층 → 바닥에 놓기 → 돌리기. 에스컬레이터·계단: 시작점만 찍으면 위층까지 계산. 주황 점에 커서를 대면 기존 구간에 고정되고, 커서로 방향을 정해 클릭. 참고: PRD OE-ML-06·07·11·19·02, OE-OBJ-15.</p>

</div>

<div class="card" id="edit"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const F=[{id:'1F',z:0},{id:'2F',z:5},{id:'3F',z:9},{id:'4F',z:12.5},{id:'5F',z:null}];
const BW=36,BH=22,WALL=Math.atan2(6,10)*180/Math.PI,PI=Math.PI,SCRPX=28;
const SP={EL:{w:2.4,col:0x7F77DD,nm:'엘리베이터'},ES:{w:1.2,ang:30,col:0x1D9E75,nm:'에스컬레이터'},ST:{w:1.5,ang:34,col:0xD85A30,nm:'계단'}};
const RED=0xE24B4A,BLUE=0x378ADD,AMB=0xEF9F27,GRAY=0x888780,GRN=0x639922;
const $=id=>document.getElementById(id),fi=id=>F.findIndex(f=>f.id===id),zf=id=>F[fi(id)].z,r1=v=>Math.round(v*10)/10;
const norm=a=>((a%360)+360)%360,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clampP=p=>({x:Math.max(0,Math.min(BW,Math.round(p.x*2)/2)),y:Math.max(0,Math.min(BH,Math.round(p.z*2)/2))});
let st={d:null,objs:[],links:[],hist:[],sel:null,view:'1F',hover:null,hoverAng:null,anchor:null,err:'',eerr:'',snapBy:null,cnt:{EL:0,ES:0,ST:0}};
const snapS=()=>JSON.stringify({o:st.objs,l:st.links}),push=()=>st.hist.push(snapS());
function newDraft(t){st.err='';st.sel=null;st.anchor=null;st.d=t==='EL'?{t,step:1,a:'1F',b:'4F',c:null,ang:0,stops:{},ok:false}:{t,startF:st.view,c:null,ang:0,up:true,dirOK:false,link:null};}
const dv=a=>[Math.cos(a*PI/180),Math.sin(a*PI/180)];
function rect(c,ang,x0,x1,hw){const[dx,dy]=dv(ang),px=-dy,py=dx;return[[x0,-hw],[x1,-hw],[x1,hw],[x0,hw]].map(([u,v])=>[c.x+dx*u+px*v,c.y+dy*u+py*v]);}
const inB=cs=>cs.every(([x,y])=>x>=-0.01&&x<=BW+0.01&&y>=-0.01&&y<=BH+0.01);
const range=(a,b)=>F.slice(fi(a),fi(b)+1).map(f=>f.id);
function calc(o){if(o.t==='EL'){const cs=rect(o.c,o.ang,-1.2,1.2,1.2);return{cs,err:inB(cs)?'':'승강로가 건물 밖으로 나감'};}
const i=fi(o.startF);if(i===F.length-1)return{err:o.startF+' 는 최상층이라 위층이 없음 — 다른 층에서 시작해 봐'};const e=F[i+1];if(F[i].z==null||e.z==null)return{err:(F[i].z==null?o.startF:e.id)+' 기준 높이가 없어 종료점을 계산할 수 없음'};
const rise=e.z-F[i].z,L=rise/Math.tan(SP[o.t].ang*PI/180),r={endF:e.id,rise,L};if(!o.c)return r;r.cs=rect(o.c,o.ang,0,L,SP[o.t].w/2);const[dx,dy]=dv(o.ang);r.end={x:o.c.x+dx*L,y:o.c.y+dy*L};if(!inB(r.cs))r.err='이 각도·위치에서는 형상(길이 '+r1(L)+'m)이 건물 밖으로 나감';return r;}
function snap(a,alt,extra){a=norm(a);if(alt)return{a:r1(a),by:null};let b=null;[[0,'건물 축',3],[90,'건물 축',3],[180,'건물 축',3],[270,'건물 축',3],[WALL,'사선 벽',3],[WALL+90,'사선 벽 직각',3],[WALL+180,'사선 벽',3],[WALL+270,'사선 벽 직각',3]].concat(extra||[]).forEach(([t,n,tol])=>{const d=Math.abs((((a-t)%360)+540)%360-180);if(d<=tol&&(!b||d-tol<b.d-b.tol))b={d,t:norm(t),n,tol}});return b?{a:b.t,by:b.n}:{a:r1(a),by:null};}
const byId=id=>st.objs.find(o=>o.id===id);
function cands(d,startF){const nf=F[fi(startF)+1],out=[];st.objs.forEach(o=>{if(o.t!==d.t)return;if(d.t==='ES'&&o.up!==d.up)return;const r=calc(o);if(r.err||!r.end)return;
if(r.endF===startF&&!st.links.some(l=>l.lower===o.id))out.push({kind:'start',id:o.id,p:r.end,y:zf(startF),ang:o.ang});if(nf&&o.startF===nf.id&&!st.links.some(l=>l.upper===o.id))out.push({kind:'end',id:o.id,p:o.c,y:zf(nf.id),ang:o.ang});});return out;}
function lstat(l){const a=byId(l.lower),b=byId(l.upper);if(!a||!b)return{ok:false,why:'대상 없음'};const r=calc(a);if(!r.end)return{ok:false,why:'형상 오류'};const z=zf(r.endF);if(a.t==='ES'&&a.up!==b.up)return{ok:false,why:'운행 방향 다름',p:r.end,z};const dd=dist(r.end,b.c);return dd<0.05?{ok:true,p:r.end,z}:{ok:false,why:'지점 어긋남 '+r1(dd)+'m',p:r.end,z};}
const linkEx=ids=>{const ex=[];ids.forEach(id=>{const o=byId(id);if(o){ex.push([o.ang,'이어진 구간 방향',8]);ex.push([o.ang+180,'꺾어 오르기(반대 방향)',8]);}});return ex;};
function extraFor(t){const ids=[];if(t===st.d){if(t.link)ids.push(t.link.to);}else st.links.forEach(l=>{if(l.lower===t.id)ids.push(l.upper);if(l.upper===t.id)ids.push(l.lower);});return linkEx(ids);}
function pivotOf(t){if(t===st.d&&t.link&&t.link.kind==='end'){const r=calc(t);return{p:r.end,end:true,y:zf(r.endF)+0.15};}return{p:t.c,end:false,y:(t.t==='EL'?zf(t.a):zf(t.startF))+0.15};}
let rot=null;
function boot(){
const wrap=$('wrap'),Wd=wrap.clientWidth,Hh=wrap.clientHeight;
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.setSize(Wd,Hh);wrap.insertBefore(R.domElement,wrap.firstChild);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,Wd/Hh,0.1,500);cam.position.set(52,34,48);
const ctl=new THREE.MapControls(cam,R.domElement);ctl.target.set(18,6,11);ctl.screenSpacePanning=false;ctl.maxPolarAngle=PI*0.47;ctl.update();
scene.add(new THREE.AmbientLight(0xffffff,0.75));const dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(30,60,20);scene.add(dl);
const stat=new THREE.Group(),dyn=new THREE.Group();scene.add(stat,dyn);
const line=(pts,col,dash,op)=>{const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(...p)));const m=dash?new THREE.LineDashedMaterial({color:col,dashSize:0.6,gapSize:0.4,transparent:true,opacity:op??1}):new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op??1});const l=new THREE.Line(g,m);if(dash)l.computeLineDistances();return l;};
function label(txt,x,y,z){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='28px sans-serif';g.fillStyle='#888780';g.fillText(txt,4,40);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));s.scale.set(6,1.5,1);s.position.set(x,y,z);return s;}
const zs=f=>f.z??15.5,slabs={};
F.forEach(f=>{const z=zs(f);const m=new THREE.Mesh(new THREE.BoxGeometry(BW,0.08,BH),new THREE.MeshLambertMaterial({color:f.z==null?RED:GRAY,transparent:true,opacity:0.06,depthWrite:false}));m.position.set(BW/2,z-0.04,BH/2);stat.add(m);slabs[f.id]=m;
stat.add(line([[0,z,0],[BW,z,0],[BW,z,BH],[0,z,BH],[0,z,0]],f.z==null?RED:GRAY,f.z==null,0.9));
[[[0,10],[36,10]],[[0,14],[22,14]],[[12,0],[12,10]],[[24,0],[24,10]],[[22,14],[32,20]]].forEach(([a,b],k)=>stat.add(line([[a[0],z,a[1]],[b[0],z,b[1]]],k===4?AMB:GRAY,false,k===4?0.9:0.45)));
stat.add(label(f.id+' '+(f.z==null?'높이 없음':f.z+'m'),-4,z+0.6,-1));});
stat.add(label('사선 벽 31°',30,1.2,21.5));
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function setRay(e){const b=R.domElement.getBoundingClientRect();mv.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(mv,cam);}
function planeHit(e,y){setRay(e);const p=new THREE.Vector3();return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-y),p)?p:null;}
function scrD(e,x,y,z){const b=R.domElement.getBoundingClientRect(),v=new THREE.Vector3(x,y,z).project(cam);return Math.hypot((v.x+1)/2*b.width+b.left-e.clientX,(1-v.y)/2*b.height+b.top-e.clientY);}
const ball=(x,y,z,col,r)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r||0.4,14,10),new THREE.MeshBasicMaterial({color:col}));m.position.set(x,y,z);return m;};
let knob=null,pick=[];
function build(o,ghost){const g=new THREE.Group(),r=calc(o),bad=!!r.err&&!!(r.cs),col=bad?RED:SP[o.t].col,op=ghost?0.3:0.5;
const mat=()=>new THREE.MeshLambertMaterial({color:col,transparent:true,opacity:op});g.position.set(o.c.x,0,o.c.y);g.rotation.y=-o.ang*PI/180;
if(o.t==='EL'){const z0=zf(o.a),top=zf(o.b)+3;const m=new THREE.Mesh(new THREE.BoxGeometry(2.4,top-z0,2.4),mat());m.position.set(0,z0+(top-z0)/2,0);g.add(m);
const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:col}));e.position.copy(m.position);g.add(e);
range(o.a,o.b).forEach(id=>{const stop=o.stops[id]!==false;const k=new THREE.Mesh(new THREE.BoxGeometry(0.15,2,1.6),new THREE.MeshLambertMaterial({color:stop?col:GRAY,transparent:true,opacity:stop?0.95:0.4}));k.position.set(1.3,zf(id)+1,0);g.add(k);});m.userData.id=o.id;pick.push(m);}
else if(r.L){const z0=zf(o.startF),z1=zf(r.endF),L=r.L,w=SP[o.t].w;
if(o.t==='ES'){const Ls=Math.hypot(L,r.rise),m=new THREE.Mesh(new THREE.BoxGeometry(Ls,0.35,w),mat());m.position.set(L/2,z0+r.rise/2,0);m.rotation.z=Math.atan2(r.rise,L);g.add(m);m.userData.id=o.id;pick.push(m);
const ar=new THREE.Mesh(new THREE.ConeGeometry(0.35,0.9,12),new THREE.MeshLambertMaterial({color:col}));ar.position.set(L/2,z0+r.rise/2+0.6,0);ar.rotation.z=(o.up?-1:1)*(PI/2-Math.atan2(r.rise,L));g.add(ar);}
else{const n=Math.max(8,Math.round(r.rise/0.18));for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(L/n,r.rise/n,w),mat());m.position.set((i+.5)*L/n,z0+(i+.5)*r.rise/n,0);g.add(m);m.userData.id=o.id;pick.push(m);}}
const hw=w/2;g.add(line([[0,z0+0.05,-hw],[L,z0+0.05,-hw],[L,z0+0.05,hw],[0,z0+0.05,hw],[0,z0+0.05,-hw]],col,false));
g.add(line([[0,z1+0.05,-hw],[L,z1+0.05,-hw],[L,z1+0.05,hw],[0,z1+0.05,hw],[0,z1+0.05,-hw]],col,true));
g.add(ball(0,z0+0.3,0,col,0.3));const en=new THREE.Mesh(new THREE.TorusGeometry(0.35,0.08,8,20),new THREE.MeshLambertMaterial({color:col}));en.rotation.x=PI/2;en.position.set(L,z1+0.2,0);g.add(en);}
return g;}
function rebuild(){while(dyn.children.length)dyn.remove(dyn.children[0]);pick=[];knob=null;
const d=st.d,act=d?(d.t==='EL'?d.a:(d.c?d.startF:st.view)):st.view;F.forEach(f=>slabs[f.id].material.opacity=f.id===act?0.2:0.06);
st.objs.forEach(o=>dyn.add(build(o,false)));
st.links.forEach(l=>{const s=lstat(l);if(s.p)dyn.add(ball(s.p.x,s.z+0.45,s.p.y,s.ok?GRN:RED,0.5));});
if(d&&d.t!=='EL'&&!d.c){const an=st.anchor;cands(d,st.view).forEach(c=>{const on=an&&an.id===c.id&&an.kind===c.kind;dyn.add(ball(c.p.x,c.y+0.45,c.p.y,AMB,on?0.65:0.38));});
if(an){const R2=new THREE.Mesh(new THREE.TorusGeometry(0.9,0.06,8,40),new THREE.MeshBasicMaterial({color:AMB}));R2.rotation.x=PI/2;R2.position.set(an.p.x,an.y+0.2,an.p.y);dyn.add(R2);
if(st.snapBy&&st.hover){const[dx,dy]=dv(st.hoverAng);dyn.add(line([[an.p.x-dx*40,an.y+0.1,an.p.y-dy*40],[an.p.x+dx*40,an.y+0.1,an.p.y+dy*40]],AMB,true));}}}
let tgt=null;
if(d){const c=d.c||(d.t==='EL'?(d.step>=2?st.hover:null):st.hover);if(c){if(d.c){tgt=d;dyn.add(build(d,false));}else dyn.add(build(Object.assign({},d,{c,startF:st.view,ang:st.hoverAng??d.ang}),true));}}
else if(st.sel)tgt=byId(st.sel);
if(tgt){const Rr=tgt.t==='EL'?2.7:2.2,pv=pivotOf(tgt);
const ring=new THREE.Mesh(new THREE.TorusGeometry(Rr,0.07,8,72),new THREE.MeshBasicMaterial({color:BLUE,transparent:true,opacity:0.7}));ring.rotation.x=PI/2;ring.position.set(pv.p.x,pv.y,pv.p.y);dyn.add(ring);
const[dx,dy]=dv(tgt.ang);knob=ball(pv.p.x+dx*Rr,pv.y,pv.p.y+dy*Rr,BLUE,0.5);dyn.add(knob);
if(rot&&st.snapBy)dyn.add(line([[pv.p.x-dx*40,pv.y,pv.p.y-dy*40],[pv.p.x+dx*40,pv.y,pv.p.y+dy*40]],AMB,true));}
hud(tgt);}
function hud(t){let s;const an=st.anchor;
if(rot&&t)s=`회전 ${r1(t.ang).toFixed(1)}°`+(st.snapBy?` · ${st.snapBy}에 붙음`:(rot.alt?' · 스냅 끔(Alt)':' · 자유'));
else if(st.d&&!st.d.c&&an)s=`${an.id} ${an.kind==='start'?'끝점에 시작점':'시작점에 끝점'} 고정 · 커서로 방향 ${r1(st.hoverAng??0).toFixed(1)}°${st.snapBy?' ('+st.snapBy+')':''} · 클릭 확정 · 멀리 빼거나 Alt 면 해제`;
else if(t)s=`회전 ${r1(t.ang).toFixed(1)}°`+(t.link?` · ${t.link.to} 에 이어 붙음`:'');
else if(st.d)s=st.d.t==='EL'&&st.d.step===1?'시작/끝 층부터 골라 줘':(st.d.t==='EL'?st.d.a:st.view)+' 바닥을 클릭해 놓기 — 주황 점에 커서를 대면 붙음';else s='만든 걸 클릭하면 고르고 돌릴 수 있음';$('hudA').textContent=s;}
