<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="446" viewBox="0 0 1240 446">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <style>
      text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#1f2937;font-size:14px}
      .m{font-family:'D2CodingLigature Nerd Font','Noto Sans Mono CJK KR',monospace;font-size:12.5px}
      .mut{fill:#6b7280}.acc{fill:#2563eb}.b{font-weight:700}.s{font-size:12.5px}.xs{font-size:11.5px}.t{font-size:18px;font-weight:700}
      .track{fill:#f0f1f3}.bar{fill:#2563eb}.bar2{fill:#9db7f5}.gray{fill:#c9ced6}.warn{fill:#d97706}
      .card{fill:#f5f6f8;stroke:#e1e4e8}.node{fill:#fff;stroke:#c9ced6;stroke-width:1.5}.nodeA{fill:#e8efff;stroke:#2563eb;stroke-width:1.5}
      .ln{stroke:#6b7280;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1240" height="446" fill="#fff"/>
  <text x="24" y="36" class="t">완전성 검사: DT 가 쓰려면 이어져 있어야 하는 것 (성수 건축+기계)</text>
  <text x="24" y="60" class="s mut">규칙 방향까지 넣은 값이다. 규칙을 펼치면 어긴 것을 3D 와 목록으로 보이고, 위반마다 이유와 한 번에 고치는 버튼이 붙는다</text>
  <text x="24" y="112" class="b s">공기 말단이 원천과 이어져 있다</text>
  <text x="24" y="132" class="xs mut">그 방을 어느 기기가 맡는지 알 수 없다</text>
  <rect x="400" y="98" width="520" height="22" rx="4" class="warn" opacity="0.35"/>
  <rect x="400" y="98" width="300.3" height="22" rx="4" class="bar"/>
  <text x="932" y="114" class="b">1,386 / 2,400</text><text x="1060" y="114" class="s mut">57.8%</text>
  <text x="24" y="174" class="b s">공기 원천이 말단 하나 이상과 이어져 있다</text>
  <text x="24" y="194" class="xs mut">담당 공간이 비어 계통도에 안 나온다</text>
  <rect x="400" y="160" width="520" height="22" rx="4" class="warn" opacity="0.35"/>
  <rect x="400" y="160" width="302.7" height="22" rx="4" class="bar"/>
  <text x="932" y="176" class="b">156 / 268</text><text x="1060" y="176" class="s mut">58.2%</text>
  <text x="24" y="236" class="b s">급기 말단이 원천 하나에서만 받는다</text>
  <text x="24" y="256" class="xs mut">둘 이상이면 방향이나 연결이 잘못됐을 수 있다</text>
  <rect x="400" y="222" width="520" height="22" rx="4" class="warn" opacity="0.35"/>
  <rect x="400" y="222" width="520.0" height="22" rx="4" class="bar"/>
  <text x="932" y="238" class="b">1,183 / 1,183</text><text x="1060" y="238" class="s mut">100.0%</text>
  <text x="24" y="298" class="b s">기기마다 소속 방이 있다</text>
  <text x="24" y="318" class="xs mut">이상 알림의 위치가 층까지만 나간다</text>
  <rect x="400" y="284" width="520" height="22" rx="4" class="warn" opacity="0.35"/>
  <rect x="400" y="284" width="438.0" height="22" rx="4" class="bar"/>
  <text x="932" y="300" class="b">4,137 / 4,911</text><text x="1060" y="300" class="s mut">84.2%</text>
  <text x="24" y="360" class="b s">흐르는 기기가 연결망에 붙어 있다</text>
  <text x="24" y="380" class="xs mut">상류·하류를 따라갈 수 없다</text>
  <rect x="400" y="346" width="520" height="22" rx="4" class="warn" opacity="0.35"/>
  <rect x="400" y="346" width="428.2" height="22" rx="4" class="bar"/>
  <text x="932" y="362" class="b">2,991 / 3,632</text><text x="1060" y="362" class="s mut">82.4%</text>
  <g class="s" transform="translate(400,410)"><rect width="16" height="12" class="bar"/><text x="22" y="11">통과</text><rect x="90" width="16" height="12" class="warn" opacity="0.35"/><text x="112" y="11">위반(고칠 대상)</text></g>
</svg>
