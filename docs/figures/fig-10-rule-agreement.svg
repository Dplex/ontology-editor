  <rect width="1240" height="560" fill="#fff"/>
  <text x="24" y="36" class="t">규칙 방향이 포트 방향과 얼마나 맞나: 성수 기계 파일</text>
  <text x="24" y="60" class="s mut">포트가 방향을 말한 연결 9,219개에 규칙이 준 방향을 대 본 값이다. 규칙 방향은 사람이 계통 단위로 확정해야 brick:feeds 로 나간다</text>
  <line x1="502.0" y1="92" x2="502.0" y2="390" stroke="#1f2937" stroke-dasharray="4 4"/>
