  <rect x="700" y="88" width="516" height="400" rx="10" class="card"/>
  <text x="720" y="118" class="b">가장 많이 어긋난 계통과 그 안의 원천</text>
  <text x="720" y="150" class="xs mut">계통</text><text x="900" y="150" class="xs mut">종류</text><text x="960" y="150" class="xs mut">일치/대 봄</text><text x="1050" y="150" class="xs mut">원천 패밀리</text>
