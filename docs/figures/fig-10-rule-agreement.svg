  <rect x="960" y="315" width="70" height="12" rx="2" class="track"/><rect x="960" y="315" width="12.2" height="12" rx="2" class="warn"/>
  <text x="1036" y="326" class="xs mut">4/23</text><text x="1080" y="326" class="s">전열교환기</text>
  <text x="720" y="370" class="s">여섯 계통 모두 원천이 전열교환기(CAD Compact Advanced)다.</text>
  <text x="720" y="392" class="s">전열교환기는 급기와 배기 양쪽에 들어 있다. 배기 계통에서는</text>
  <text x="720" y="414" class="s">실내 공기를 받아들이는 쪽인데, 규칙은 원천에서 흘러</text>
  <text x="720" y="436" class="s">나가는 것으로 본다. 그래서 방향이 거꾸로 선다.</text>
  <text x="720" y="464" class="xs mut">병원의 흡입구 일체형 천장 배기팬과 모양은 같지만 기기가 다르다.</text>
  <text x="24" y="540" class="s mut">어긋나는 계통은 확정 표에서 일치율로 먼저 보인다. 사람이 확정하지 않은 규칙 방향은 온톨로지에 나가지 않는다</text>
