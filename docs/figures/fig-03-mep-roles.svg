<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
  <defs>
    <style>
      text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#1f2937;font-size:14px}
      .mut{fill:#6b7280}.acc{fill:#2563eb}.b{font-weight:700}.s{font-size:12.5px}.t{font-size:18px;font-weight:700}
      .card{fill:#f5f6f8;stroke:#e1e4e8}.node{fill:#fff;stroke:#c9ced6}.nodeA{fill:#e8efff;stroke:#2563eb}
      .ln{stroke:#9ca3af;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1240" height="560" fill="#fff"/>
  <text x="24" y="36" class="t">설비의 역할은 IFC 클래스 계층이 이미 말해 준다. 그리고 대부분은 기기가 아니라 덕트·배관이다</text>

  <!-- 트리 -->
  <rect x="24" y="66" width="220" height="44" rx="8" class="node"/>
  <text x="38" y="86" class="s mut">IfcDistributionElement</text><text x="38" y="103" class="s b">설비 전체</text>
  <path class="ln" d="M134,110 V140 H119 V160"/><path class="ln" d="M134,140 H430 V160"/>
  <rect x="24" y="160" width="190" height="44" rx="8" class="node"/>
  <text x="38" y="180" class="s mut">…ControlElement</text><text x="38" y="197" class="s">계측 · 센서</text>
  <rect x="330" y="160" width="200" height="44" rx="8" class="node"/>
  <text x="344" y="180" class="s mut">…FlowElement</text><text x="344" y="197" class="s">흐름을 다루는 것</text>

  <path class="ln" d="M430,204 V230 H94 V252"/>
  <path class="ln" d="M430,230 H1014 V252"/>
  <path class="ln" d="M242,230 V252"/><path class="ln" d="M398,230 V252"/><path class="ln" d="M554,230 V252"/>
  <path class="ln" d="M710,230 V252"/><path class="ln" d="M866,230 V252"/><path class="ln" d="M1014,230 V252"/>

  <g class="s">
    <rect x="24" y="252" width="140" height="92" rx="8" class="nodeA"/>
    <text x="36" y="274" class="mut">EnergyConversion</text><text x="36" y="296" class="b acc">소스</text><text x="36" y="316">보일러·공조기</text><text x="36" y="334">칠러</text>
    <rect x="172" y="252" width="140" height="92" rx="8" class="nodeA"/>
    <text x="184" y="274" class="mut">FlowMoving</text><text x="184" y="296" class="b acc">소스</text><text x="184" y="316">펌프·팬</text>
    <rect x="328" y="252" width="140" height="92" rx="8" class="nodeA"/>
    <text x="340" y="274" class="mut">FlowTerminal</text><text x="340" y="296" class="b acc">싱크</text><text x="340" y="316">토출구·라디에이터</text><text x="340" y="334">위생기구·콘센트</text>
    <rect x="484" y="252" width="140" height="92" rx="8" class="node"/>
    <text x="496" y="274" class="mut">FlowController</text><text x="496" y="296" class="b">제어</text><text x="496" y="316">밸브·댐퍼</text>
    <rect x="640" y="252" width="140" height="92" rx="8" class="node"/>
    <text x="652" y="274" class="mut">Storage·Treatment</text><text x="652" y="296" class="b">저장·처리</text><text x="652" y="316">탱크·필터</text>
    <rect x="796" y="252" width="140" height="92" rx="8" fill="#fff" stroke="#6b7280" stroke-dasharray="5 4"/>
    <text x="808" y="274" class="mut">FlowSegment</text><text x="808" y="296" class="b">도관</text><text x="808" y="316">덕트·배관 구간</text>
    <rect x="944" y="252" width="140" height="92" rx="8" fill="#fff" stroke="#6b7280" stroke-dasharray="5 4"/>
    <text x="956" y="274" class="mut">FlowFitting</text><text x="956" y="296" class="b">도관</text><text x="956" y="316">엘보·티·레듀서</text>
  </g>
  <text x="24" y="376" class="s mut">요소가 있으면 반드시 이 중 하나다. 포트·계통·PredefinedType 이 비어 있어도 "소스인가, 싱크인가, 도관인가"는 안다.</text>

  <!-- 비율 막대 -->
  <text x="24" y="424" class="b">Duplex MEP 의 "설비 926"을 열어 보면</text>
  <rect x="24" y="440" width="1192" height="40" rx="6" fill="#f0f1f3"/>
  <rect x="24" y="440" width="182" height="40" rx="6" fill="#2563eb"/>
  <text x="38" y="466" class="b" style="fill:#fff">기기 141</text>
  <text x="222" y="466" class="b">덕트·배관 구간 427 + 이음쇠 358 = 785 (85%)</text>
  <text x="24" y="512" class="s">ifc4Mep 도 같다: 2,202 중 1,895 (86%)가 도관이다. "설비 926 대"로 내보내면 DT 에 거짓 숫자가 간다.</text>
  <text x="24" y="534" class="s mut">그래서 기기는 <tspan class="acc">brick:*</tspan> 로, 도관은 <tspan class="acc">fso:Segment · fso:Fitting</tspan> 으로 나눠 내보낸다.</text>
</svg>
