name: PRD check

# docs/prd 의 티켓 파일·Epic README·PRD_011.md 가 서로 어긋나지 않는지 본다(src/lib/prd.test.ts).
# 파일만 읽는 검사라 data/·네트워크·보드 인증이 필요 없다. 보드(이슈·칸반) 동기화는 여기에 넣지 않는다.
on:
  pull_request:
    paths:
      - 'docs/prd/**'
      - 'docs/bim-to-dt-ontology.md'
      - 'src/lib/prd.test.ts'
      - '.github/workflows/prd-check.yml'

permissions:
  contents: read

concurrency:
  group: prd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prd-test:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # scripts 는 건너뛴다 — 이 검사는 vitest 만 있으면 되고 WASM 복사(sync:wasm)나 브라우저 설치가 필요 없다.
      - run: npm ci --ignore-scripts

      - run: npx vitest run src/lib/prd.test.ts
