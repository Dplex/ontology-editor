name: Board check

# 티켓 md(docs/prd/features)와 칸반 이슈가 어긋났는지 **점검만** 한다(scripts/sync-board.mjs, 쓰지 않는다).
# 반영(`npm run board -- --apply`)은 사람이 로컬에서 한다 — 문구만 다듬은 수정에도 `modified` 가 붙어 카드가 In Progress 로
# 돌아가니, 무엇이 바뀌는지 보고 나서 돌린다.
#   PR        : 이 PR 을 merge 하면 어느 이슈의 본문·라벨이 바뀌는지 미리 보인다(PR 의 md 로 잰다)
#   main push : merge 뒤 아직 반영 안 된 어긋남이 남았는지 보인다
# 결과는 실행 요약(Summary)에 남는다. 어긋남이 있어도 실패로 치지 않는다(어긋남은 반영 대기이지 오류가 아니다).
# 보드를 읽으려면 project 범위 토큰이 필요해서 PROJECT_TOKEN 을 쓴다.
on:
  pull_request:
    paths: ['docs/prd/features/**', 'scripts/sync-board.mjs']
  push:
    branches: [main]
    paths: ['docs/prd/features/**', 'scripts/sync-board.mjs']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 포크 PR 에는 시크릿이 안 가서 보드를 못 읽는다
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dt-dev]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 보드 점검 (쓰지 않음)
        env:
          # 55 의 gh(2.46)는 엔터프라이즈 호스트에서 GH_TOKEN 을 안 보고 GH_ENTERPRISE_TOKEN 만 본다. 안 주면 55 에 저장된
          # 사람 로그인으로 돈다(project 범위가 없어 보드를 못 읽는다).
          GH_ENTERPRISE_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_HOST: github.sec.samsung.net
        run: |
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          set +e
          node scripts/sync-board.mjs > "$RUNNER_TEMP/board.txt" 2>&1; code=$?
          node scripts/sync-board.mjs --diff > "$RUNNER_TEMP/diff.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/board.txt"
          {
            if [[ "${{ github.event_name }}" == pull_request ]]; then
              echo "### 이 PR 을 merge 하면 바뀌는 이슈"
            else
              echo "### 아직 반영 안 된 어긋남"
            fi
            if ! grep -q '^보드 동기화 점검' "$RUNNER_TEMP/board.txt"; then echo "❌ 점검이 돌지 못했다(아래 출력)"
            elif [[ $code -eq 0 ]]; then echo "없음 ✅"; else
              echo "반영은 로컬에서 \`npm run board -- --apply\`. 개발이 손댄 이슈(In Progress·In Review·Done)의 요구사항·수용 기준이 바뀌면 \`modified\` 가 붙어 칸반이 따라 움직인다."
            fi
            echo; echo '```'; cat "$RUNNER_TEMP/board.txt"; echo '```'
            echo; echo '<details><summary>새로 쓸 수정 이력 (--diff)</summary>'; echo; echo '```'; cat "$RUNNER_TEMP/diff.txt"; echo '```'; echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          # 어긋남(종료 코드 1)은 실패가 아니다. 스크립트가 깨져도 node 는 1 로 끝나니, 머리 줄이 찍혔는지로 가른다.
          grep -q '^보드 동기화 점검' "$RUNNER_TEMP/board.txt"
