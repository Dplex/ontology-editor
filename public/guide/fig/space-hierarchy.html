.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

="M348 241.6L348 229.3"/><text class="iso-face-text" data-tone="hi" transform="matrix(1.41 0.661 -1.183 0.788 211.194 155.683)" font-size="4" text-anchor="start">4 · 계통 · 포트</text></g></svg></div></div><div class="sh-steps" role="group" aria-label="도메인 계층"><button type="button" aria-pressed="true">1 · 물리존 (IfcSpace)</button><button type="button" aria-pressed="false">2 · 룸 (수동 분할 구획)</button><button type="button" aria-pressed="false">3 · 공조존 (HVAC Zone)</button><button type="button" aria-pressed="false">4 · 계통 · 포트 (System & Port)</button></div><p class="sh-note" data-note>건축 BIM 파일을 불러올 때 IfcSpace 하나가 물리존 하나가 됩니다. 설비 소속 판정과 이상 알림 위치의 기본 단위입니다.</p><pre class="sh-ttl" data-ttl>ex:Space_OpenOffice a brick:Space ; rdfs:label "오픈 오피스" ; brick:isPartOf ex:Storey_2F .</pre><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>현재 선택한 공간·공조 개념 계층</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>리드스크류 기둥 위에서 분해·조립되는 나머지 계층</span></span><span class="iso-caption">같은 바닥이라도 건축 BIM에서 온 기본 공간은 [물리존], 사람이 에디터에서 쪼갠 구획은 [룸], 에너지 모델(IDF)에서 온 열제어 구역은 [공조존], 그 위에서 공기와 물을 보내는 배관·덕트 묶음은 [계통]과 [포트]입니다.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
